name: Verificar o SG
on:
  push:
    branches: [main, codex/v69-phase1-local]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run check:fast
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:runtime
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node tests/founders.test.mjs
      - run: node tests/founders-client.test.mjs
      - run: node tests/founders-mirror.test.mjs
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - run: npm ci --prefix functions
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run validate:phase1 -- --only firestore
      - if: ${{ !cancelled() }}
        run: npm run validate:phase1 -- --only security-s01
      - if: ${{ !cancelled() }}
        run: npm run validate:phase1 -- --only founders-emulator
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: firestore-phase1-evidence
          path: artifacts/phase1-*/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
